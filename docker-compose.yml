services:
  trackwave:
    build: .
    container_name: trackwave
    ports:
      - "8787:8787"
    environment:
      MUSIC_PROVIDER_DEFAULT: ${MUSIC_PROVIDER_DEFAULT:-deezer}
      DEEZER_CACHE_TTL_MS: ${DEEZER_CACHE_TTL_MS:-21600000}
      TRACKWAVE_DB_PATH: ${TRACKWAVE_DB_PATH:-/app/data/trackwave.db}
      CACHE_DB_PATH: ${CACHE_DB_PATH:-/app/data/trackwave-cache.db}
      DEEZER_MAX_RELEASES: ${DEEZER_MAX_RELEASES:-500}
      SPOTIFY_MAX_RELEASES: ${SPOTIFY_MAX_RELEASES:-500}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-DE}
      MUSICBRAINZ_CACHE_ENABLED: ${MUSICBRAINZ_CACHE_ENABLED:-true}
      MUSICBRAINZ_CACHE_TTL_FOUND_MS: ${MUSICBRAINZ_CACHE_TTL_FOUND_MS:-2592000000}
      MUSICBRAINZ_CACHE_TTL_MISSING_MS: ${MUSICBRAINZ_CACHE_TTL_MISSING_MS:-86400000}
      MUSICBRAINZ_REQUEST_SLOT_MS: ${MUSICBRAINZ_REQUEST_SLOT_MS:-1100}
      # Required by MusicBrainz API etiquette (descriptive app name/version/contact), or your
      # server's IP risks being rate-limited/blocked. Set this before deploying to production.
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-Trackwave/1.0 ( contact-not-configured )}
      PORT: 8787
      NODE_ENV: production
    volumes:
      - trackwave_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  trackwave_data:
